<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Google Gemini AI Text Simplification Pipeline Diagram">
  <rect width="640" height="360" rx="16" fill="#F4EFE6"/>
  <!-- Left Box: Dense Text -->
  <rect x="30" y="45" width="210" height="270" rx="10" fill="#FFFFFF" stroke="#D6CFC2" stroke-width="3"/>
  <text x="50" y="80" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#474F54">1. Dense Source Text</text>
  <rect x="50" y="105" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="122" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="139" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="156" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="173" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="190" width="170" height="8" rx="4" fill="#5C6469"/>
  <rect x="50" y="207" width="140" height="8" rx="4" fill="#5C6469"/>
  <text x="50" y="255" font-family="Verdana, sans-serif" font-size="12" fill="#D96B27">High Cognitive Load</text>
  <!-- Center Node: Gemini API -->
  <circle cx="320" cy="180" r="52" fill="#1B5E7B"/>
  <text x="282" y="175" font-family="Verdana, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Gemini 2.5</text>
  <text x="296" y="196" font-family="Verdana, sans-serif" font-size="13" fill="#FFF9DB">Flash API</text>
  <!-- Right Box: Simplified Output -->
  <rect x="400" y="45" width="210" height="270" rx="10" fill="#FFF9DB" stroke="#1B5E7B" stroke-width="3"/>
  <text x="420" y="80" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#1B5E7B">2. Simplified Output</text>
  <circle cx="428" cy="115" r="5" fill="#D96B27"/>
  <rect x="442" y="110" width="145" height="10" rx="5" fill="#222629"/>
  <circle cx="428" cy="150" r="5" fill="#D96B27"/>
  <rect x="442" y="145" width="135" height="10" rx="5" fill="#222629"/>
  <circle cx="428" cy="185" r="5" fill="#D96B27"/>
  <rect x="442" y="180" width="140" height="10" rx="5" fill="#222629"/>
  <rect x="420" y="220" width="170" height="65" rx="6" fill="#E8F0F2" stroke="#1B5E7B" stroke-width="1.5"/>
  <text x="432" y="245" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#1B5E7B">Key Term Glossary</text>
  <text x="432" y="268" font-family="Verdana, sans-serif" font-size="11" fill="#222629">Plain-language definitions</text>
</svg>
